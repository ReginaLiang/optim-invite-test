<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Optim6 invitation — landing</title>
<style>
  :root{--bg:#fbfbfa;--fg:#1c1b19;--mut:#6b6862;--line:#e0ddd7;--card:#fff;--ok:#1a7f4b;--warn:#8a5a00;--err:#a02020;--code:#f4f2ee}
  @media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#191817;--fg:#e8e6e1;--mut:#9a958c;--line:#33312e;--card:#211f1d;--ok:#5fbf8a;--warn:#d0a04a;--err:#e07a7a;--code:#26241f}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif}
  .wrap{max-width:760px;margin:0 auto;padding:32px 20px 64px}
  h1{font-size:19px;margin:0 0 4px}
  .sub{color:var(--mut);font-size:13px;margin-bottom:24px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px;margin-bottom:16px}
  .card h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);margin:0 0 12px;font-weight:600}
  button{padding:10px 16px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--fg);font:inherit;font-size:14px;cursor:pointer}
  button:hover{border-color:var(--mut)}
  button.primary{background:var(--fg);color:var(--bg);border-color:var(--fg)}
  button:disabled{opacity:.45;cursor:not-allowed}
  .prov{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
  .prov button{display:flex;align-items:center;gap:8px;min-width:190px;justify-content:center}
  .choice{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:4px}
  .choice button[aria-pressed=true]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
  .row{display:grid;grid-template-columns:130px 1fr;gap:6px 14px;font-size:14px}
  .row dt{color:var(--mut);font-size:13px}
  .row dd{margin:0;word-break:break-word}
  pre{background:var(--code);border:1px solid var(--line);border-radius:7px;padding:11px;overflow-x:auto;font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;margin:8px 0 0}
  .badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:12px;font-weight:600;border:1px solid}
  .b-none{color:var(--ok);border-color:var(--ok)} .b-rev{color:var(--warn);border-color:var(--warn)} .b-act{color:var(--err);border-color:var(--err)}
  .err{color:var(--err)} .muted{color:var(--mut);font-size:13px}
  .msg{font-size:13px;margin-top:12px;min-height:1em}
</style>
</head>
<body>
<div class="wrap">
  <h1>Optim6 invitation — landing page</h1>
  <div class="sub">Manual test harness for UC-01 / UC-02. The raw response of each call is shown with it.</div>

  <div class="card" id="infoCard" hidden>
    <h2>1 · What the link resolves to</h2>
    <dl class="row" id="info"></dl>
    <pre id="infoRaw"></pre>
  </div>

  <div class="card" id="actCard" hidden>
    <h2>2 · Accept or decline</h2>
    <div id="actBody"></div>
    <div class="msg" id="actMsg"></div>
    <pre id="actRaw" hidden></pre>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
// The API origin is a property of the deployment this page is published for, and the token is
// only ever legitimate when it came from the mail link. Neither is an input any more: a page that
// lets the visitor retype the origin is a page that can be pointed at somebody else's API, and a
// token box invites pasting a link somebody else received.
const API  = 'https://event.optimportal.com';
const BASE = '/actiontec/api/unauth/platform/v6';
let INFO = null;

// The action the provider round trip is being started FOR. Both ACCEPT and DECLINE prove identity
// the same way on a provider account (IV-11 ②), so the choice only decides what the callback page
// posts when it gets back — it changes nothing about the round trip itself.
let ACTION = 'ACCEPT';

function say(html, isErr){
  $('actMsg').className = 'msg' + (isErr ? ' err' : ' muted');
  $('actMsg').innerHTML = html;
}

function showRaw(obj){
  $('actRaw').hidden = false;
  $('actRaw').textContent = JSON.stringify(obj ?? {}, null, 2);
}

async function call(method, path, body){
  const url = API + BASE + path;
  let res, text;
  try {
    res = await fetch(url, {
      method,
      headers: body ? {'Content-Type':'application/json'} : undefined,
      body: body ? JSON.stringify(body) : undefined
    });
    text = await res.text();
  } catch (e) {
    // The single most likely failure when this page is not on the API's origin.
    const err = new Error('Network or CORS failure — ' + e.message + '. This page origin is ' +
      location.origin + '; the API must return Access-Control-Allow-Origin for it.');
    err.network = true;
    throw err;
  }
  let data = null;
  try { data = text ? JSON.parse(text) : null; } catch { data = text; }
  if (!res.ok) {
    const err = new Error((data && data.message) || ('HTTP ' + res.status));
    err.payload = data; err.status = res.status;
    throw err;
  }
  return data;
}

// ---- the token comes from the mail link, and from nowhere else --------------
const TOKEN = (new URLSearchParams(location.search).get('token') || '').trim();

// ---- resolve ---------------------------------------------------------------
async function resolve() {
  $('infoCard').hidden = true; $('actCard').hidden = true;
  try {
    INFO = await call('GET', `/invitations/${encodeURIComponent(TOKEN)}`);
  } catch (e) {
    $('infoCard').hidden = false;
    $('info').innerHTML = '<dt>Result</dt><dd class="err">' +
      (e.status ? e.status + ' · ' + ((e.payload && e.payload.errorType) || '') : e.message) + '</dd>';
    $('infoRaw').textContent = JSON.stringify(e.payload ?? {}, null, 2);
    return;
  }
  renderInfo();
  renderActions();
}

// Arriving from the invitation mail, the token is already in the URL and the origin is known, so
// there is nothing to ask for: resolve immediately and land the invitee on the provider picker.
if (TOKEN) {
  resolve();
} else {
  $('infoCard').hidden = false;
  $('info').innerHTML = '<dt>Result</dt><dd class="err">no token in the URL</dd>';
  $('infoRaw').textContent = 'Open this page from the link in the invitation mail — ' +
    'it carries ?token=… . The token is never entered by hand.';
}

function renderInfo(){
  const cls = {NONE:'b-none', REVOKED:'b-rev', ACTIVE:'b-act'}[INFO.accountState] || '';
  const rows = [
    ['accountState', `<span class="badge ${cls}">${INFO.accountState}</span>`],
    ['email', INFO.email ?? '—'],
    ['isp', INFO.isp ? `${INFO.isp.displayName ?? INFO.isp.name ?? ''} <span class="muted">(${INFO.isp.id})</span>` : '—'],
    ['roles', (INFO.roles || []).map(r => r.displayName || r.name).join(', ') || '—'],
    ['loginMethod', INFO.loginMethod ?? '—'],
    ['expiresAt', INFO.expiresAt ? new Date(INFO.expiresAt).toLocaleString() : '—']
  ];
  $('info').innerHTML = rows.map(([k,v]) => `<dt>${k}</dt><dd>${v}</dd>`).join('');
  $('infoRaw').textContent = JSON.stringify(INFO, null, 2);
  $('infoCard').hidden = false;
}

// ---- what may be offered, shaped by accountState ---------------------------
// Provider only. The password path is deliberately absent: this page exists to exercise the
// invitation round trip through Google / Microsoft, and offering a password box next to it
// trains the invitee to type a password into a page they reached from a mailed link.
function renderActions(){
  const st = INFO.accountState;
  const box = $('actBody');
  $('actCard').hidden = false;
  say('');

  if (st === 'ACTIVE') {
    box.innerHTML = '<p class="muted">This account already holds live grants, so the link is <b>navigation only</b>. ' +
      'Any action here is <code>409 / 1438 SIGN_IN_REQUIRED</code> by design — sign in normally and act on it from ' +
      '<code>GET /v6/me/invitations</code> instead.</p>';
    return;
  }

  // REVOKED with a password account: both ACCEPT and DECLINE need the password as their proof
  // (ID-4), and offering a provider button here would only produce 403 / 1413 "wrong method".
  if (st === 'REVOKED' && INFO.loginMethod === 'PASSWORD') {
    box.innerHTML = '<p class="muted">This account’s one login method is <b>PASSWORD</b>. Both actions ' +
      'prove identity with that password (ID-4), and this harness deliberately has no password box — ' +
      'a page reached from a mailed link must not train anyone to type one. Exercise this case with a ' +
      'direct <code>POST /invitations/{token}/action</code> carrying <code>password</code>.</p>';
    return;
  }

  if (st === 'NONE') {
    // Spec-confirmed, not a page limitation: the server refuses DECLINE before the account exists
    // ("DECLINE is not available before the account exists", 400 / 1439). With no account there is
    // no identity to prove, and the link is not a credential.
    const n = derivedNames();
    box.innerHTML = `
      <p class="muted">The account is being created, so UM-3 makes <code>firstName</code> and
      <code>lastName</code> mandatory — <code>user.first_name</code> / <code>last_name</code> are
      <code>NOT NULL</code> and the invitation row carries no names. They are not typed here: the page
      derives them from the invited address and sends
      <code>${n.firstName}</code> / <code>${n.lastName}</code>.</p>
      <div class="prov" id="prov"><span class="muted">loading providers…</span></div>
      <p class="muted" style="margin-top:12px"><b>Decline is not offered here.</b> With no account there is
      no identity to prove, so the server refuses it with <code>400 / 1439</code>. Ignoring the mail is the
      decline — the IV-8 reaper purges the invitation at expiry.</p>`;
    ACTION = 'ACCEPT';
    loadProviders();
    return;
  }

  // REVOKED with a provider account: accept and decline are both on offer, and both take the same
  // round trip. The choice is made BEFORE the provider button, because it travels with the state.
  box.innerHTML = `
    <p class="muted">accountState is <b>REVOKED</b> — the account exists, so names are <b>rejected</b> here.
    Both actions prove it is you through the provider first (IV-11 ②); the round trip is identical and
    only the action posted on the way back differs.</p>
    <div class="choice">
      <button id="pickAccept" aria-pressed="true">Accept</button>
      <button id="pickDecline" aria-pressed="false">Decline</button>
    </div>
    <p class="muted" id="choiceNote"></p>
    <div class="prov" id="prov"><span class="muted">loading providers…</span></div>`;

  const notes = {
    ACCEPT: 'The invited grants activate and a session is returned (<code>200</code>). The user id, ' +
            'the identity row and the audit history all survive untouched (ID-7).',
    DECLINE: 'The invitation and its inert grants are <b>deleted</b> — there is no DECLINED status ' +
             '(<code>204</code>, no body). The account itself stays revoked; nothing is activated.'
  };
  const pick = a => {
    ACTION = a;
    $('pickAccept').setAttribute('aria-pressed', String(a === 'ACCEPT'));
    $('pickDecline').setAttribute('aria-pressed', String(a === 'DECLINE'));
    $('choiceNote').innerHTML = notes[a];
    say('');
  };
  $('pickAccept').onclick  = () => pick('ACCEPT');
  $('pickDecline').onclick = () => pick('DECLINE');
  pick('ACCEPT');
  loadProviders();
}

async function loadProviders(){
  try {
    const r = await call('GET', '/oauth2/providers');
    const list = (r && r.data) || [];
    if (!list.length) { $('prov').innerHTML = '<span class="muted">No enabled providers on this environment.</span>'; return; }
    $('prov').innerHTML = '';
    for (const p of list) {
      const b = document.createElement('button');
      b.textContent = 'Continue with ' + (p.displayName || p.providerType || p.id);
      b.onclick = () => startRoundTrip(p);
      $('prov').appendChild(b);
    }
  } catch (e) {
    $('prov').innerHTML = '<span class="err">Could not load providers.</span>';
    say(e.message, true);
  }
}

// The authorize URL is built BY THE SERVER and carries a short-lived state
// (oauth2.authorizationStateTtlSeconds, 600s). That is why it cannot be baked
// into the invitation mail: it would be dead before most people opened it.
async function startRoundTrip(provider){
  const names = collectNames();
  try {
    const r = await call('POST', '/oauth2/authorizations', {
      providerId: provider.id,
      purpose: 'INVITATION',
      invitationToken: TOKEN
    });
    // The callback page needs to know which invitation this state belongs to, and WHICH ACTION the
    // person chose: the state proves the round trip was authorised for this invitation, it does not
    // record whether they meant to accept or decline.
    sessionStorage.setItem('optim.pending', JSON.stringify({
      purpose: 'INVITATION', action: ACTION,
      api: API, token: TOKEN, state: r.state,
      accountState: INFO.accountState, ...names
    }));
    say('State minted, expires in ' + r.expiresIn + 's — sending you to the provider to ' +
        ACTION.toLowerCase() + '…');
    location.href = r.authorizationUrl;
  } catch (e) {
    say(e.status ? e.status + ' · ' + ((e.payload && e.payload.errorType) || e.message) : e.message, true);
    if (e.payload) showRaw(e.payload);
  }
}

/**
 * UM-3 names for the account-creation path, derived rather than typed.
 *
 * <p>They cannot simply be dropped from the request: {@code createAccountViaLink} refuses a body
 * without them with {@code 400 / 1439}, because {@code user.first_name} and {@code user.last_name}
 * are {@code NOT NULL} columns and the {@code invitation} row holds no names to fall back on. The
 * provider profile is not consulted for them either — the server reads the body and nothing else.
 * So the harness stops ASKING for them and keeps SENDING them.
 */
function derivedNames(){
  const local = String(INFO.email || '').split('@')[0] || 'optim';
  const parts = local.split(/[._-]+/).filter(Boolean);
  const cap = w => w.charAt(0).toUpperCase() + w.slice(1).toLowerCase();
  return {
    firstName: cap(parts[0] || 'Optim'),
    lastName:  cap(parts.slice(1).join(' ') || 'Invitee')
  };
}

function collectNames(){
  return INFO.accountState === 'NONE' ? derivedNames() : {};
}
</script>
</body>
</html>
