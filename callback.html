<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Optim6 invitation — OAuth callback</title>
<style>
  :root{--bg:#fbfbfa;--fg:#1c1b19;--mut:#6b6862;--line:#e0ddd7;--card:#fff;--ok:#1a7f4b;--err:#a02020;--code:#f4f2ee}
  @media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#191817;--fg:#e8e6e1;--mut:#9a958c;--line:#33312e;--card:#211f1d;--ok:#5fbf8a;--err:#e07a7a;--code:#26241f}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif}
  .wrap{max-width:760px;margin:0 auto;padding:32px 20px 64px}
  h1{font-size:19px;margin:0 0 4px}
  .sub{color:var(--mut);font-size:13px;margin-bottom:24px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px;margin-bottom:16px}
  .card h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);margin:0 0 12px;font-weight:600}
  pre{background:var(--code);border:1px solid var(--line);border-radius:7px;padding:11px;overflow-x:auto;font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;margin:8px 0 0}
  .row{display:grid;grid-template-columns:130px 1fr;gap:6px 14px;font-size:14px}
  .row dt{color:var(--mut);font-size:13px} .row dd{margin:0;word-break:break-all}
  .ok{color:var(--ok)} .err{color:var(--err)} .muted{color:var(--mut);font-size:13px}
  button{padding:10px 16px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--fg);font:inherit;font-size:14px;cursor:pointer}
  button:hover{border-color:var(--mut)}
  a{color:inherit}
</style>
</head>
<body>
<div class="wrap">
  <h1>Optim6 invitation — OAuth callback</h1>
  <div class="sub">This page is the single registered <code>oauth2.redirectUri</code>. It exchanges nothing itself — the server does.</div>

  <div class="card">
    <h2>What came back from the provider</h2>
    <dl class="row" id="params"></dl>
  </div>

  <div class="card" id="resultCard">
    <h2>Result</h2>
    <div id="result" class="muted">working…</div>
    <pre id="raw" hidden></pre>
  </div>

  <p class="muted"><a href="./index.html">← back to the landing page</a></p>
</div>

<script>
const $ = id => document.getElementById(id);
const BASE = '/actiontec/api/unauth/platform/v6';
// A sign-in round trip stashes nothing, so this page needs its own default origin.
const API  = 'https://event.optimportal.com';

const qs    = new URLSearchParams(location.search);
const code  = qs.get('code');
const state = qs.get('state');
const perr  = qs.get('error');

function fail(html){ $('result').innerHTML = '<span class="err">' + html + '</span>'; }
function showRaw(obj){ $('raw').hidden = false; $('raw').textContent = JSON.stringify(obj ?? {}, null, 2); }

$('params').innerHTML = [
  ['code',  code  ? code.slice(0, 12) + '…' : '<span class="err">absent</span>'],
  ['state', state ? state.slice(0, 12) + '…' : '<span class="err">absent</span>'],
  ['error', perr ? '<span class="err">' + perr + '</span>' : '—']
].map(([k,v]) => `<dt>${k}</dt><dd>${v}</dd>`).join('');

// The landing page stashed which invitation this round trip belongs to, and which action was
// chosen. The state alone tells the CLIENT neither — the server knows the purpose it minted the
// state for, but it does not know whether the person meant to accept or decline, and the client
// must send the action to the right token.
let pending = null;
try { pending = JSON.parse(sessionStorage.getItem('optim.pending') || 'null'); } catch {}

/** POST, tolerating a 204 with no body — which is exactly what DECLINE answers. */
async function post(url, body){
  const res  = await fetch(url, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)});
  const text = await res.text();
  let data = null;
  try { data = text ? JSON.parse(text) : null; } catch { data = text; }
  return { res, data };
}

/**
 * PROVIDER_CODE sign-in — the ordinary way a provider account gets a session.
 *
 * <p>Nothing about this is invitation-specific: the account already exists and the server
 * resolves it by (oauth_config_id, subject), NOT by email address. That is why changing the
 * address on the Google account does not strand the Optim account.
 */
async function signIn(){
  const api = (pending && pending.api) || API;
  const url = api + BASE + '/sessions';
  let out;
  try {
    out = await post(url, { method: 'PROVIDER_CODE', state, code });
  } catch (e) {
    fail('Network or CORS failure — ' + e.message + '. This page origin is ' + location.origin + '.');
    return;
  }
  const { res, data } = out;
  showRaw(data);

  if (!res.ok || !data || !data.accessToken) {
    fail('Sign-in refused: ' + res.status + ' · ' + ((data && (data.errorType || data.message)) || res.status));
    return;
  }
  sessionStorage.removeItem('optim.pending');
  const ctx = (data.actRole ? (data.actRole.displayName || data.actRole.name) : '?') + ' @ ' +
              (data.actIsp ? (data.actIsp.displayName || data.actIsp.name) : '?');
  $('result').innerHTML =
    '<span class="ok"><b>Signed in.</b></span> <span class="muted">' + ctx + '</span>' +
    '<p class="muted" style="margin-top:12px">Paste this into Postman’s <code>accessToken</code> ' +
    'collection variable, or into the portal’s <code>localStorage.accessToken</code>. ' +
    'The header is <code>X-Authorization: Bearer &lt;token&gt;</code>.</p>' +
    '<textarea id="tok" readonly style="width:100%;height:110px;font:12px/1.5 ui-monospace,Menlo,monospace">' +
    data.accessToken + '</textarea>' +
    '<div style="margin-top:8px"><button id="copy">Copy token</button></div>';
  $('copy').onclick = () => {
    $('tok').select();
    navigator.clipboard.writeText(data.accessToken);
  };
}

async function run(){
  if (perr) {
    fail('The provider refused: ' + perr + ' — nothing was sent to the API.');
    return;
  }
  if (!code || !state) {
    fail('Missing <code>code</code> or <code>state</code> — nothing to redeem.');
    return;
  }
  // Two round trips land here, and the client is the only one that has to tell them apart:
  // the server knows the purpose from the state it minted, but the CLIENT must know which
  // endpoint to redeem at. An invitation stashes what it belongs to; a sign-in stashes
  // nothing it needs, so "nothing stashed" IS the sign-in case.
  if (!pending || pending.purpose === 'SIGN_IN') {
    return signIn();
  }
  if (pending.state && pending.state !== state) {
    // Not the security check — the server enforces that. This only catches a stale tab.
    $('result').innerHTML = '<span class="muted">Note: the returned state is not the one this tab ' +
      'minted (stale tab?). Continuing — the server refuses it with 1421/1472 if it is genuinely wrong.</span>';
  }

  // ACCEPT and DECLINE are the same round trip and the same proof (IV-11 ②). Only the action
  // differs, and for a provider account BOTH need the code and the state: declining a revoked
  // account still has to prove who is knocking, or a mailed link alone could delete somebody
  // else's invitation.
  const action = pending.action === 'DECLINE' ? 'DECLINE' : 'ACCEPT';
  const body = { action, state, code };

  // No names are sent, and none may be: the server writes them from the provider's assertion on
  // the account-creating path (UM-3 as amended by TRS v2.12) and refuses a body that names either,
  // in both account states. On REVOKED that is the older rule — no account is renamed through a
  // mailed link — and on NONE it is the new one: the provider is the single source.

  const url = pending.api + BASE + '/invitations/' + encodeURIComponent(pending.token) + '/action';
  let out;
  try {
    out = await post(url, body);
  } catch (e) {
    fail('Network or CORS failure — ' + e.message +
         '. This page origin is ' + location.origin + '; the API must allow it via Access-Control-Allow-Origin.');
    return;
  }
  const { res, data } = out;
  if (data !== null) showRaw(data);

  if (!res.ok) {
    $('result').innerHTML =
      '<span class="err">' + action + ' refused: ' + res.status + ' · ' +
      ((data && (data.errorType || data.message)) || res.status) + '</span>' +
      hint(data && data.errorCode);
    return;
  }

  sessionStorage.removeItem('optim.pending');

  if (action === 'DECLINE') {
    // 204, no body. There is deliberately no DECLINED status: the invitation row and its inert
    // grants are DELETED, so re-resolving the same link now answers 410 / 1433.
    $('result').innerHTML = '<span class="ok"><b>Declined.</b></span> ' +
      '<span class="muted">HTTP ' + res.status + ', no body — as specified.</span>' +
      '<p class="muted">The invitation and its inert grants were deleted; there is no DECLINED status. ' +
      'The account itself is untouched and stays revoked. Re-opening the same link now answers ' +
      '<code>410 / 1433</code>, which is the check worth making next.</p>';
    return;
  }

  const grants = (data && data.grants) || [];
  $('result').innerHTML = '<span class="ok"><b>Accepted.</b></span> ' +
    (data && data.accessToken ? 'A session was returned (accessToken present).' : '') +
    (grants.length ? '<p class="muted">Grants: ' + grants.map(g =>
        (g.isp && (g.isp.displayName || g.isp.name || g.isp.id)) + ' → ' +
        (g.roles || []).map(r => r.displayName || r.name).join(', ')
      ).join(' · ') + '</p>' : '');
}

// The refusals this flow actually produces, so a failure is diagnosable from the page.
function hint(codeNum){
  const m = {
    1410:'The provider did not assert a verified email. Identity rests on email_verified (ID-2).',
    1412:'The invitation expired before it was acted on. The fix is a resend, not a new grant.',
    1413:'The provider identity is not this account’s, or this account signs in the other way (ID-4).',
    1416:'The provider asserted a different address than the one invited. Deliberate — it is the takeover path this closes.',
    1417:'The identity proof did not verify.',
    1433:'Link unknown, revoked, superseded by a resend — or already declined, since declining deletes it. Indistinguishable by design.',
    1438:'The account already holds live grants: sign in and act on it from /v6/me/invitations instead.',
    1439:'The action body was not usable — missing, not ACCEPT/DECLINE, or a DECLINE while accountState is NONE.',
    1472:'The state was unknown, expired, already consumed, or bound to a different purpose.'
  }[codeNum];
  return m ? '<p class="muted">' + m + '</p>' : '';
}

run();
</script>
</body>
</html>
