<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Optim6 invitation — OAuth callback</title>
<style>
  :root{--bg:#fbfbfa;--fg:#1c1b19;--mut:#6b6862;--line:#e0ddd7;--card:#fff;--ok:#1a7f4b;--err:#a02020;--code:#f4f2ee}
  @media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#191817;--fg:#e8e6e1;--mut:#9a958c;--line:#33312e;--card:#211f1d;--ok:#5fbf8a;--err:#e07a7a;--code:#26241f}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif}
  .wrap{max-width:760px;margin:0 auto;padding:32px 20px 64px}
  h1{font-size:19px;margin:0 0 4px}
  .sub{color:var(--mut);font-size:13px;margin-bottom:24px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px;margin-bottom:16px}
  .card h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);margin:0 0 12px;font-weight:600}
  pre{background:var(--code);border:1px solid var(--line);border-radius:7px;padding:11px;overflow-x:auto;font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;margin:8px 0 0}
  .row{display:grid;grid-template-columns:130px 1fr;gap:6px 14px;font-size:14px}
  .row dt{color:var(--mut);font-size:13px} .row dd{margin:0;word-break:break-all}
  .ok{color:var(--ok)} .err{color:var(--err)} .muted{color:var(--mut);font-size:13px}
  .log{font:12px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre-wrap;word-break:break-word}
  a{color:inherit}
</style>
</head>
<body>
<div class="wrap">
  <h1>Optim6 invitation — OAuth callback</h1>
  <div class="sub">This page is the single registered <code>oauth2.redirectUri</code>. It exchanges nothing itself — the server does.</div>

  <div class="card">
    <h2>What came back from the provider</h2>
    <dl class="row" id="params"></dl>
  </div>

  <div class="card" id="resultCard">
    <h2>Result</h2>
    <div id="result" class="muted">working…</div>
    <pre id="raw" hidden></pre>
  </div>

  <div class="card">
    <h2>Log</h2>
    <div class="log" id="log"></div>
  </div>

  <p class="muted"><a href="./index.html">← back to the landing page</a></p>
</div>

<script>
const $ = id => document.getElementById(id);
const BASE = '/actiontec/api/unauth/platform/v6';

function log(msg, obj){
  const t = new Date().toISOString().slice(11,19);
  let line = `[${t}] ${msg}`;
  if (obj !== undefined) line += '\n' + JSON.stringify(obj, null, 2);
  $('log').textContent = line + '\n\n' + $('log').textContent;
}

const qs    = new URLSearchParams(location.search);
const code  = qs.get('code');
const state = qs.get('state');
const perr  = qs.get('error');

$('params').innerHTML = [
  ['code',  code  ? code.slice(0, 12) + '…' : '<span class="err">absent</span>'],
  ['state', state ? state.slice(0, 12) + '…' : '<span class="err">absent</span>'],
  ['error', perr ? '<span class="err">' + perr + '</span>' : '—']
].map(([k,v]) => `<dt>${k}</dt><dd>${v}</dd>`).join('');

// The landing page stashed which invitation this round trip belongs to. The state
// alone does not tell the CLIENT that — the server knows, but the client must send
// the action to the right token.
let pending = null;
try { pending = JSON.parse(sessionStorage.getItem('optim.pending') || 'null'); } catch {}

async function run(){
  if (perr) {
    $('result').innerHTML = '<span class="err">The provider refused: ' + perr + '</span>';
    log('provider returned error=' + perr + ' — nothing sent to the API.');
    return;
  }
  if (!code || !state) {
    $('result').innerHTML = '<span class="err">Missing <code>code</code> or <code>state</code> — nothing to exchange.</span>';
    return;
  }
  if (!pending) {
    $('result').innerHTML = '<span class="err">No pending invitation in this tab\'s sessionStorage.</span>' +
      '<p class="muted">The round trip must be started from the landing page in the <b>same tab</b> — ' +
      'sessionStorage is per-tab. Start again from <a href="./index.html">index.html</a>.</p>';
    return;
  }
  if (pending.state && pending.state !== state) {
    // Not the security check — the server enforces that. This only catches a stale tab.
    log('WARNING: returned state does not match the one this tab minted. Continuing anyway; ' +
        'the server will refuse it with 1421/1472 if it is genuinely wrong.');
  }

  const body = { action: 'ACCEPT', state, code };
  // UM-3: names are required only where the account is being created.
  if (pending.accountState === 'NONE') {
    body.firstName = pending.firstName;
    body.lastName  = pending.lastName;
  }

  const url = pending.api + BASE + '/invitations/' + encodeURIComponent(pending.token) + '/action';
  log('POST ' + url, body);
  let res, text;
  try {
    res  = await fetch(url, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)});
    text = await res.text();
  } catch (e) {
    log('NETWORK/CORS FAILURE — ' + e.message +
        '\nThis page origin is ' + location.origin + '; the API must allow it via Access-Control-Allow-Origin.');
    $('result').innerHTML = '<span class="err">Network or CORS failure — see the log.</span>';
    return;
  }
  let data = null;
  try { data = text ? JSON.parse(text) : null; } catch { data = text; }
  log('← ' + res.status, data);
  $('raw').hidden = false;
  $('raw').textContent = JSON.stringify(data ?? {}, null, 2);

  if (res.ok) {
    sessionStorage.removeItem('optim.pending');
    const grants = (data && data.grants) || [];
    $('result').innerHTML = '<span class="ok"><b>Accepted.</b></span> ' +
      (data && data.accessToken ? 'A session was returned (accessToken present).' : '') +
      (grants.length ? '<p class="muted">Grants: ' + grants.map(g =>
          (g.isp && (g.isp.displayName || g.isp.name || g.isp.id)) + ' → ' +
          (g.roles || []).map(r => r.displayName || r.name).join(', ')
        ).join(' · ') + '</p>' : '');
  } else {
    const t = (data && (data.errorType || data.message)) || res.status;
    $('result').innerHTML = '<span class="err">Refused: ' + res.status + ' · ' + t + '</span>' +
      hint(data && data.errorCode);
  }
}

// The refusals this flow actually produces, so a failure is diagnosable from the page.
function hint(codeNum){
  const m = {
    1410:'The provider did not assert a verified email. Identity rests on email_verified (ID-2).',
    1412:'The invitation expired before it was accepted. The fix is a resend, not a new grant.',
    1416:'The provider asserted a different address than the one invited. Deliberate — it is the takeover path this closes.',
    1433:'Link unknown, revoked, or superseded by a resend — indistinguishable by design.',
    1438:'The account already holds live grants: sign in and accept from /v6/me/invitations instead.',
    1439:'The action body was not usable (missing or not ACCEPT/DECLINE).',
    1472:'The state was unknown, expired, already consumed, or bound to a different purpose.'
  }[codeNum];
  return m ? '<p class="muted">' + m + '</p>' : '';
}

run();
</script>
</body>
</html>
